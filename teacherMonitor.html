<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마음온도 · 교사 모니터링</title>
  </head>
  <body class="admin-body">
    <header class="site-header admin-header">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">☀️</span>
        <span class="brand-name">마음온도</span>
        <span class="brand-sub">교사 모니터링</span>
      </a>
      <a class="btn btn-ghost" href="/">← 처음으로</a>
    </header>

    <p id="auth-checking" class="hero-note page-checking">권한을 확인하는 중…</p>

    <!-- 관리자 확인 후에만 표시 -->
    <main id="admin-main" class="admin-layout" hidden>
      <!-- 좌측: 사용자 표시 + 필터 -->
      <aside class="card admin-sidebar" aria-label="필터">
        <div class="admin-user">
          <img id="admin-photo" class="user-photo" alt="" referrerpolicy="no-referrer" hidden />
          <div class="admin-user-text">
            <strong id="admin-name"></strong>
            <span id="admin-email" class="muted-small"></span>
          </div>
          <button id="logout-btn" class="tool-btn" type="button">로그아웃</button>
        </div>

        <section class="sidebar-section">
          <div class="sidebar-title-row">
            <h2 class="sidebar-title">📅 날짜</h2>
            <button id="refresh-btn" class="link-btn" type="button">새로고침</button>
          </div>
          <div class="sidebar-actions">
            <button id="select-all-dates" class="link-btn" type="button">전체 선택</button>
            <button id="clear-dates" class="link-btn" type="button">선택 해제</button>
          </div>
          <div id="date-list" class="date-list" role="group" aria-label="날짜 선택"></div>
        </section>

        <section class="sidebar-section sidebar-grow">
          <h2 class="sidebar-title">
            🧑‍🎓 제출 목록 <span id="submission-count" class="count-badge">0</span>
          </h2>
          <ul id="submission-list" class="submission-list"></ul>
        </section>

        <p id="sidebar-status" class="status-text" role="status" aria-live="polite"></p>
      </aside>

      <!-- 가운데: 대화 내용 -->
      <section class="card admin-panel" aria-labelledby="chat-panel-title">
        <h2 id="chat-panel-title" class="panel-title">💬 대화 내용</h2>
        <div id="detail-meta" class="detail-meta" hidden></div>
        <div id="chat-view" class="chat-log admin-chat">
          <p class="empty-text">왼쪽에서 날짜를 고른 뒤 제출 기록을 눌러 주세요.</p>
        </div>
      </section>

      <!-- 오른쪽: 그림 -->
      <section class="card admin-panel" aria-labelledby="drawing-panel-title">
        <h2 id="drawing-panel-title" class="panel-title">🎨 그림</h2>
        <div id="drawing-view" class="drawing-view">
          <p class="empty-text">선택한 기록의 그림이 여기에 보여요.</p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/admin.js"></script>
  </body>
</html>
